# Cloudflare Workers 設定（`pnpm preview` 與 `pnpm deploy` 使用）
name = "tw"
main = "src/worker.ts"
compatibility_date = "2026-11-24"
upload_source_maps = true

# dist 作為靜態資源；只把 OAuth 兩條路由交給 Worker 先處理，其餘直接由資產回應。
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/auth", "/callback"]

# 非機密變數；OAuth 的 client secret 用 `wrangler secret put` 設定。
[vars]
SITE_URL = "https://tw.shechen.workers.dev"
# 限定 CMS token 只能存取 shechen-tw/shechen
GITHUB_REPOSITORY_ID = "1469486652"
